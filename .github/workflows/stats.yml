name: stats

# ClearPath test-stats producer (estate test-scope tile).
# Emits the contract-conformant stats.json from vitest's own JSON reporter (runner-reported,
# never grep) and publishes it to the UNPROTECTED `stats-data` branch, never to a PR head and
# never to main. Contract: neckarshore-planning/docs/reference/stats-json-contract.md §1a
# (protected-producer exception, `statsRef: stats-data`). Same shape as trustscope e2e.yml.
#
# Why not the PR head any more (neckarshore-planning, Bob row BOB-1108-CLEARPATH-STATS-DATA):
# the old producer committed stats.json to the PR head with the GITHUB_TOKEN. GitHub's recursion
# guard then left the required checks without a run on that head, and the PR read blocked until
# someone pushed with user credentials (clearpath #114 twice, #133). Publishing after the merge,
# to a data branch no required check guards, removes the cause instead of the symptom.
#
# Two jobs for least privilege:
#   generate-stats  (contents: read)  — npm ci, vitest and the third-party test-stats-action run
#                                       here; the token they can reach cannot push.
#   publish-stats   (contents: write) — downloads the validated file and pushes it with git
#                                       plumbing. No npm ci, no third-party action, so no untrusted
#                                       code runs while the write token is in scope.
#
# The stats.json still on main is the last PR-time copy. It stays until the neckarshore-website
# aggregator reads `statsRef: stats-data` for clearpath; removing it first would blind that tile.

on:
  push:
    branches: [main]
    paths-ignore:
      - "stats.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-stats:
    name: generate stats.json
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # continue-on-error: a red run still writes the report and is emitted red:true, never a
      # stale-green count and never a silent skip (contract §1).
      - id: vitest
        continue-on-error: true
        run: npx vitest run --reporter=json --outputFile=.vitest-report.json
      - uses: neckarshore-ai/test-stats-action@eff3ddbc9e7d9b68db38f451d0395681ff8df592 # v1.2.0
        with:
          repo: ${{ github.repository }}
          runners: "unit:vitest:.vitest-report.json"
          out: stats.json
          sha: ${{ github.sha }}
          test_result: ${{ steps.vitest.outcome }}
      # Structural contract gate, before the artifact: a malformed stats.json is never published.
      - name: Validate emitted stats.json against the contract
        run: |
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .repo == $repo
            and (.audited_sha | type == "string" and length > 0)
            and (.tests.total == ([.tests.byType[]] | add))
            and (.red | type == "boolean")
          ' stats.json > /dev/null \
            || { echo "::error::stats.json failed contract validation"; cat stats.json; exit 1; }
          echo "stats.json is contract-valid:"; cat stats.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stats-json
          path: stats.json
          retention-days: 1
          if-no-files-found: error

  publish-stats:
    name: publish stats.json (stats-data branch)
    needs: generate-stats
    if: needs.generate-stats.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-stats-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stats-json
      # Git plumbing, not a branch switch: stats-data shares no history with main. The tree is
      # exactly {stats.json, vercel.json}; vercel.json turns Vercel deploys off for this
      # data-only branch (Vercel reads the gate from the pushed branch itself, trustscope
      # 2026-07-12). Diff-guard ignores updatedAt, so a re-run on the same sha does not churn.
      - name: Publish stats.json to stats-data when it changed
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          norm() { jq -S 'del(.updatedAt)' "$1" 2>/dev/null; }
          VERCEL_JSON='{"$schema":"https://openapi.vercel.sh/vercel.json","git":{"deploymentEnabled":false}}'
          git fetch origin +refs/heads/stats-data:refs/remotes/origin/stats-data 2>/dev/null || true
          if git show origin/stats-data:stats.json > /tmp/prev-stats.json 2>/dev/null \
             && [ "$(norm /tmp/prev-stats.json)" = "$(norm stats.json)" ] \
             && [ "$(git show origin/stats-data:vercel.json 2>/dev/null)" = "$VERCEL_JSON" ]; then
            echo "stats.json unchanged and the deploy gate is current — nothing to publish."
            exit 0
          fi
          STATS_BLOB=$(git hash-object -w stats.json)
          VERCEL_BLOB=$(printf '%s\n' "$VERCEL_JSON" | git hash-object -w --stdin)
          TREE=$(printf '100644 blob %s\tstats.json\n100644 blob %s\tvercel.json\n' "$STATS_BLOB" "$VERCEL_BLOB" | git mktree)
          MSG="chore(stats): emit stats.json @ ${GITHUB_SHA:0:7}"
          if git rev-parse --verify origin/stats-data >/dev/null 2>&1; then
            COMMIT=$(git commit-tree "$TREE" -p origin/stats-data -m "$MSG")
          else
            COMMIT=$(git commit-tree "$TREE" -m "$MSG")
          fi
          # An empty source refspec would DELETE stats-data; refuse instead.
          [ -n "$COMMIT" ] || { echo "::error::commit-tree produced no commit — refusing to push"; exit 1; }
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" \
            push origin "${COMMIT}:refs/heads/stats-data"
