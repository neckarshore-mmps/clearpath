name: stats

# ClearPath test-stats producer (estate test-scope tile).
# Emits the contract-conformant stats.json from vitest's own JSON reporter
# (runner-reported, never grep) and commits it to the PR branch when the
# test counts changed. main is protected (PR-only + required checks), so a
# push-to-main commit-back is structurally impossible here; since ALL
# changes reach main through PRs, emitting at PR time covers every change
# and the file lands on main via the normal review gate.
# Contract: neckarshore-planning/docs/reference/stats-json-contract.md
#
# Loop guard: the commit is only made when `tests`, `red` or `red_detail`
# differs from the version at HEAD — the bot's own commit triggers one more round that
# finds identical counts and stops. Deliberately NO skip-ci marker: the
# required checks must run on the bot commit for the PR to stay mergeable.
#
# Dependabot PRs run with a read-only GITHUB_TOKEN; they cannot push, but
# dependency bumps do not change test counts, so the diff guard exits
# before any push is attempted.
#
# KNOWN CAVEAT (GITHUB_TOKEN recursion guard): the bot's stats commit does
# NOT retrigger workflow runs, so after it lands the PR's required checks
# sit on the previous head. Revive them by pushing any commit with user
# credentials or closing/reopening the PR. Only affects PRs that change
# test counts; estate-level fix (PAT/GitHub-App or check-based producer)
# is tracked with MASCHIN.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: stats-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  emit-stats:
    name: emit test-stats
    # Same-repo PRs only — fork PRs carry no push credential and untrusted refs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the stats commit to the PR head branch
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Do not leave the write-scoped token in .git/config while npm ci
          # and vitest execute third-party code; inject it only at push time.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - id: vitest
        run: npx vitest run --reporter=json --outputFile=.vitest-report.json
      # v1.2.0 (was v1.0.0 @101f0c2): v1.0.0 emits `red: null`, which fails the contract check
      # below on every run. v1.2.0 takes test_result and emits red/red_detail/declared (clearpath#91).
      - uses: neckarshore-ai/test-stats-action@eff3ddbc9e7d9b68db38f451d0395681ff8df592 # v1.2.0
        with:
          runners: "unit:vitest:.vitest-report.json"
          out: stats.json
          sha: ${{ github.event.pull_request.head.sha }}
          # A failing vitest step ends the job before this point, so an emitted file is always a
          # green run. The outcome is passed anyway so the file says so instead of assuming it.
          test_result: ${{ steps.vitest.outcome }}
      - name: "PROBE (throwaway, reverted in the next commit): corrupt tests.total by one"
        run: jq '.tests.total += 1' stats.json > /tmp/s.json && mv /tmp/s.json stats.json
      # Estate structural contract check (clearpath#91, same invariants as trustscope e2e.yml).
      # Fail BEFORE the commit step, so a malformed stats.json never lands on a PR branch.
      - name: Validate emitted stats.json against the contract
        run: |
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .repo == $repo
            and (.audited_sha | type == "string" and length > 0)
            and (.tests.total == ([.tests.byType[]] | add))
            and (.red | type == "boolean")
          ' stats.json > /dev/null \
            || { echo "::error::stats.json failed contract validation"; cat stats.json; exit 1; }
          echo "stats.json is contract-valid:"; cat stats.json
      - name: Commit stats.json to the PR branch when test counts or red state changed
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git show HEAD:stats.json > /tmp/stats-prev.json 2>/dev/null \
             && python3 -c "import json,sys; a=json.load(open('/tmp/stats-prev.json')); b=json.load(open('stats.json')); k=('tests','red','red_detail'); sys.exit(0 if all(a.get(x)==b.get(x) for x in k) else 1)"; then
            echo "Test counts and red state unchanged — no stats commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add stats.json
          git commit -m "chore: update stats.json"
          git push origin "HEAD:refs/heads/$HEAD_REF"
