name: Dependabot auto-merge

# Auto-merges the SAFE class of Dependabot PRs once the repo's required checks pass.
# Policy: neckarshore-planning/docs/reference/dependabot-auto-merge-policy.md (ADOPTED 2026-07-10).
# (Repointed 2026-07-20: docs/specs/ was dissolved by AD-43; the old path is dead.)
#
# `on: pull_request` (NOT pull_request_target) — GitHub's official auto-merge pattern.
# For first-party Dependabot PRs the elevated `permissions:` block grants the built-in
# GITHUB_TOKEN the write scope `gh pr merge --auto` needs. The job never checks out or
# runs PR code, so there is no untrusted-code execution surface. pull_request_target is
# unnecessary here and would needlessly expose the base-branch secret context — avoided
# by design (least-privilege, #270 spirit).
on: pull_request

# Least-privilege: exactly the two scopes `gh pr merge --auto` requires (#270 §3.1).
permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-auto-merge:
    runs-on: ubuntu-latest
    # Guard: only ever act on first-party Dependabot PRs.
    if: github.actor == 'dependabot[bot]'
    steps:
      # Third-party action pinned to a full commit SHA (#270 §3.2 — Pinned-Dependencies).
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Safe class per the adopted policy:
      #   - patch          (any ecosystem)
      #   - github-actions (NON-MAJOR only — actions-majors go manual per the cohort-1 PIR)
      #   - minor          (dev-dependency only)
      # Everything else (runtime minor, ANY major incl. actions) falls through to manual review.
      #
      # Green CI is the HARD gate: `--auto` holds the merge until every required check passes
      # on the final (rebased) head, so a bump that breaks a required check never merges, and
      # rebase churn is absorbed without a human babysitting the PR.
      - name: Enable auto-merge for the safe class
        if: >
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          (steps.meta.outputs.package-ecosystem == 'github_actions' &&
           steps.meta.outputs.update-type != 'version-update:semver-major') ||
          (steps.meta.outputs.update-type == 'version-update:semver-minor' &&
           steps.meta.outputs.dependency-type == 'direct:development')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Indirect (transitive) MINOR that closes a security advisory joins the safe
      # class (Founder 2026-10-28, from Bob's report 2026-10-23 fm 6: clearpath#123,
      # vite, sat green and unmerged for days while the audit gate it would clear
      # blocked every other PR).
      #
      # How "closes a security advisory" is known WITHOUT a new credential:
      # fetch-metadata reports the alert only with `alert-lookup`, which needs a
      # personal token. But Dependabot VERSION updates touch only direct
      # dependencies unless dependabot.yml has an `allow:` block (GitHub docs,
      # "allow": default is all explicitly defined dependencies). So with no
      # `allow:` on the base branch, an indirect PR can only come from a SECURITY
      # update. This step proves that precondition from the base branch (never
      # from the PR) and fails closed: a read error turns this step red (visible)
      # and arms nothing; an `allow:` block arms nothing.
      - name: Is this indirect minor a security update?
        id: indirect
        if: >
          steps.meta.outputs.update-type == 'version-update:semver-minor' &&
          steps.meta.outputs.dependency-type == 'indirect'
        run: |
          set -euo pipefail
          cfg="$(gh api "repos/${REPO}/contents/.github/dependabot.yml?ref=${BASE_SHA}" --jq '.content' | base64 -d)"
          if [ -z "$cfg" ]; then echo "dependabot.yml unreadable -> manual review"; exit 0; fi
          if printf '%s\n' "$cfg" | grep -Eq '^[[:space:]]*allow:'; then
            echo "dependabot.yml has an allow: block, indirect version updates are possible -> manual review"
            exit 0
          fi
          echo "no allow: block on ${BASE_SHA}: an indirect PR is a security update"
          echo "security=true" >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for an indirect security minor
        if: steps.indirect.outputs.security == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
